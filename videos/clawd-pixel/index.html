<script>
(function(){
const CUE = JSON.parse(document.getElementById('cues').textContent);
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

// deterministic PRNG (no Math.random in compositions)
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ── palette ───────────────────────────────────────────────────────────────
const P = {
  o:'#D97757', s:'#B5573E', e:'#191726',               // Clawd
  g:'#8BD17C', d:'#4E9A4A', w:'#F0EEE6', k:'#191726',  // bug
  y:'#F4C76B', Y:'#FFE39A', f:'#F4A24B', F:'#D9573F',  // gold / flame
  c:'#F0EEE6', C:'#C9C4B6', r:'#D97757', R:'#B5573E', b:'#5B6FA8', B:'#8FA6DA', // rocket
  h:'#E0605A', m:'#F3E7C6', n:'#D8C79E', a:'#2C2848', A:'#3A355C', p:'#8C86B0'
};

// ── sprites (one char = one pixel, "." = transparent) ─────────────────────
// Clawd: the 18×5 half-block mascot from the Claude Code banner, rows doubled to square pixels.
const BODY = '...oooooooooooo...', EYES = '...ooeooooooeoo...', ARMS = '.oooooooooooooooo.', SHADE = '...ssssssssssss...';
const LEGS_A = '....o.o....o.o....', LEGS_B = '...o.o......o.o...', NONE = '..................';
const CLAWD = {
  idle:  [BODY, BODY, EYES, EYES, ARMS, ARMS, BODY, SHADE, LEGS_A, LEGS_A],
  blink: [BODY, BODY, BODY, '...ooeooooooeoo...'.replace(/e/g,'s'), ARMS, ARMS, BODY, SHADE, LEGS_A, LEGS_A],
  up:    ['.o.oooooooooooo.o.', '.o.oooooooooooo.o.', '.ooooeooooooeoooo.', '.ooooeooooooeoooo.', BODY, BODY, BODY, SHADE, LEGS_A, LEGS_A],
  walkA: [BODY, BODY, EYES, EYES, ARMS, ARMS, BODY, SHADE, LEGS_A, LEGS_A],
  walkB: [BODY, BODY, EYES, EYES, ARMS, ARMS, BODY, SHADE, LEGS_B, LEGS_B],
  jump:  ['.o.oooooooooooo.o.', '.o.oooooooooooo.o.', '.ooooeooooooeoooo.', '.ooooeooooooeoooo.', BODY, BODY, BODY, SHADE, LEGS_B, NONE],
};
const BUG = {
  a: ['..k......k..','...k....k...','..dddddddd..','.dggggggggd.','.dgwkggwkgd.','ddggggggggdd','.dggggggggd.','..dddddddd..','.k..k..k..k.'],
  b: ['..k......k..','...k....k...','..dddddddd..','.dggggggggd.','.dgwkggwkgd.','ddggggggggdd','.dggggggggd.','..dddddddd..','k..k....k..k'],
};
const TOKEN = ['...y...','.y.y.y.','..yyy..','yyyYyyy','..yyy..','.y.y.y.','...y...'];
const HEART = ['.hh.hh.','hhhhhhh','hhhhhhh','.hhhhh.','..hhh..','...h...'];
const TAIL  = ['kkkkkkkk','kwwwwwwk','.kwwwwk.','..kwwk..','...kk...'];
const CLOUD = ['.....aaaa.......','...aaaaaaaa.....','..aaaaaaaaaaa...','.aaaaaaaaaaaaaa.','aaaaaaaaaaaaaaaa','.AAAAAAAAAAAAAA.'];
const ROCKET = [
  '.......rr.......','......rrrr......','.....rrrrrr.....','.....cccccc.....','....cccccccc....','....cccccccc....','...cccccccccC...',
  '...ccckkkkccC...','...cckbbbBkcC...','...cckbbbbkcC...','...cckbbbbkcC...','...cckBbbbkcC...','...ccckkkkccC...',
  '...cccccccccC...','...cccccccccC...','...rrrrrrrrrR...','...rrrrrrrrrR...','...cccccccccC...','...cccccccccC...',
  '..rcccccccccCr..','.rrcccccccccCrr.','.rrcccccccccCrr.','rrrcccccccccCrrr','rrrcccccccccCrrr',
  'rrr.kkkkkkkk.rrr','rr...kkkkkk...rr'];
const ROCKET_CHUNKS = [[24,26],[19,24],[13,19],[7,13],[0,7]]; // fall order: nozzle → nose
const PUFF = ['..cccc..','.cccccc.','cccccccc','cccccccc','cccccccc','.cCCCCc.','..CCCC..'];
const FACE = ['oooo','eooe','eooe','oooo'];
const FLAME = {
  a: ['fyyyyyyf','.fyyyyf.','.ffyyff.','..ffff..','..F..F..','...FF...'],
  b: ['fyyyyyyf','ffyyyyff','.fyyyyf.','..fyyf..','...ff...','...FF...'],
};
const FLAG = ['Cwwwwwwww','Cwwoooowww'.slice(0,9),'Cwoeooeow','Cwwoooowww'.slice(0,9),'Cwwowwoww','Cwwwwwwww'].concat(Array(14).fill('C........'));

function svg(map, s, pal){
  pal = pal || P; const h = map.length, w = map[0].length; let r = '';
  for (let y = 0; y < h; y++){
    const row = map[y]; if (row.length !== w) throw new Error('sprite row ' + y + ' has width ' + row.length + ', expected ' + w);
    let x = 0;
    while (x < w){ const ch = row[x]; if (ch === '.'){ x++; continue; } let x2 = x; while (x2 < w && row[x2] === ch) x2++;
      r += `<rect x="${x*s}" y="${y*s}" width="${(x2-x)*s}" height="${s}" fill="${pal[ch]}"/>`; x = x2; }
  }
  return `<svg width="${w*s}" height="${h*s}" viewBox="0 0 ${w*s} ${h*s}">${r}</svg>`;
}
function frames(id, set, s, first){
  $('#'+id).innerHTML = Object.keys(set).map(k => `<div class="fr${k===first?' on':''}" data-f="${k}">${svg(set[k], s)}</div>`).join('');
}

// ── scenery generators ───────────────────────────────────────────────────
function skySVG(){
  const bands = ['#0F0E1A','#141225','#1A1730','#211D3B','#282347'], edges = [480, 780, 1032, 1260, 1500];
  let r = '', top = 0;
  bands.forEach((col, i) => { r += `<rect x="0" y="${top}" width="1080" height="${edges[i]-top}" fill="${col}"/>`; top = edges[i]; });
  for (let i = 0; i < bands.length - 1; i++) for (let x = 0; x < 90; x++){ // checker dither on band seams
    const y0 = edges[i] - 12; if (x % 2 === 0) r += `<rect x="${x*12}" y="${y0}" width="12" height="12" fill="${bands[i+1]}"/>`;
    else r += `<rect x="${x*12}" y="${edges[i]}" width="12" height="12" fill="${bands[i]}"/>`;
  }
  return `<svg width="1080" height="1500">${r}</svg>`;
}
function starsSVG(seed, n, h, groups){
  const R = rng(seed), out = Array.from({length: groups}, () => '');
  for (let i = 0; i < n; i++){
    const x = Math.floor(R()*90)*12, y = Math.floor(R()*(h/12))*12, g = i % groups, big = R() < 0.12, dim = R() < 0.45;
    const col = dim ? '#8C86B0' : '#F0EEE6';
    if (big) out[g] += `<rect x="${x}" y="${y-12}" width="12" height="36" fill="${col}"/><rect x="${x-12}" y="${y}" width="36" height="12" fill="${col}"/>`;
    else out[g] += `<rect x="${x}" y="${y}" width="${dim?6:12}" height="${dim?6:12}" fill="${col}"/>`;
  }
  return out.map((r, i) => `<svg class="tw tw${i}" style="position:absolute;left:0;top:0" width="1080" height="${h}">${r}</svg>`).join('');
}
function discMap(rad, fill, rim, dark, seed){
  const R = rng(seed), d = rad*2, rows = [];
  const craters = Array.from({length: 4}, () => [R()*d*0.7 + d*0.15, R()*d*0.7 + d*0.15, 1 + R()*rad*0.25]);
  for (let y = 0; y < d; y++){ let row = '';
    for (let x = 0; x < d; x++){ const dx = x + .5 - rad, dy = y + .5 - rad, q = Math.sqrt(dx*dx + dy*dy);
      if (q > rad) { row += '.'; continue; }
      const cr = craters.some(([cx, cy, cr]) => Math.hypot(x + .5 - cx, y + .5 - cy) < cr);
      row += (q > rad - 1.2 && dx > 0) || (dx + dy > rad*0.9 && (x + y) % 2 === 0) ? rim : cr ? dark : fill; }
    rows.push(row); }
  return rows;
}
function hillsSVG(w, base, amp, f1, f2, col, seed){
  const R = rng(seed), p1 = R()*6, p2 = R()*6; let r = '';
  for (let x = 0; x < w/12; x++){
    const hh = Math.round((base + amp*(Math.sin(x*f1 + p1) + 0.5*Math.sin(x*f2 + p2)))/12)*12;
